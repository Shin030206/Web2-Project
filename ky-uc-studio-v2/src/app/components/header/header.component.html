<header class="site-header">
  <div class="header-inner container">
    <!-- Logo -->
    <a routerLink="/" class="logo-wrap">
      <img src="assets/images/logo.png" alt="Ký Ức Studio" class="logo-img">
    </a>

    <!-- Navigation Menu -->
    <nav class="nav-menu">
      @for (item of navLinks; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.path === '/'}">
          {{ item.title }}
        </a>
      }
      <!-- Hotline -->
      <a [href]="'tel:' + hotline" class="hotline-link">
        <svg class="phone-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.568 17.568 0 0 0 4.168 6.608 17.569 17.569 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.678.678 0 0 0-.58-.122l-2.19.547a1.745 1.745 0 0 1-1.657-.459L5.47 8.53a1.745 1.745 0 0 1-.46-1.657l.548-2.19a.678.678 0 0 0-.122-.58L3.654 1.328z"/>
        </svg>
        <span>{{ hotline }}</span>
      </a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <a routerLink="/login" class="btn-outline">Đăng nhập</a>
      <a routerLink="/register" class="btn-ghost">Đăng ký</a>
      <a routerLink="/dat-lich" class="btn-primary">Đặt lịch</a>
    </div>
  </div>
</header>
